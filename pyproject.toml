[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-detection-2026"
version = "0.1.0"
description = "Reproducible baseline for the Kaggle Hyperspectral Object Detection Challenge 2026"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

